<html>
    <head>
        <style>
            body {
                background-color: #000;
            }

            svg {
                border: 2px solid #f0f;
            }

            .eyebox {
                border: 2px solid #ccc;
            }

            .clicktarget {
                fill: #000;
            }

            .eye {
                fill: #fff;
            }

            .pupil {
                fill: #000;
            }

            .eyelid {
                fill: #0003;
            }

            .tickup {
                fill: #0ff;
            }

            .tickdown {
                fill: #f0f;
            }
        </style>

        <script type="module">
            import {Tween, Easing} from 'https://unpkg.com/@tweenjs/tween.js@23.1.3/dist/tween.esm.js'

            let ready = false;

            const EYE_RADIUS = 240;
            const PUPIL_RADIUS = 140;
            
            const TICK_RATE = 50

            const PUPIL_SPEED = 50;
            const OFFSET_SPEED = 30;

            const EYELID_OPEN = -280 - 560;
            const EYELID_CLOSED = -280;
            const EYELID_SPEED = 400;

            let eyeOffset = [0, 0]
            let pupilPosition = [0, 0]

            let leftEyePos = [
                Number(localStorage.getItem("leftX") ?? 400), 
                Number(localStorage.getItem("leftY") ?? 400)
            ];
            let rightEyePos = [
                Number(localStorage.getItem("rightX") ?? 1500), 
                Number(localStorage.getItem("rightY") ?? 400)
            ]
            let eyeScale = localStorage.getItem("scale") ?? 1

            function initialize() {
                if (ready) {
                    return;
                }

                const test = document.getElementById("left-pupil");

                if (test == undefined) {
                    setTimeout(initialize, 10);
                    return;
                }

                ready = true;

                document.querySelectorAll(".eye").forEach(e => e.setAttribute("r", EYE_RADIUS))
                document.querySelectorAll(".pupil").forEach(p => p.setAttribute("r", PUPIL_RADIUS))
                document.querySelectorAll(".clicktarget").forEach(t => {
                    t.setAttribute("x", -EYE_RADIUS)
                    t.setAttribute("y", -EYE_RADIUS)
                    t.setAttribute("width", EYE_RADIUS * 2)
                    t.setAttribute("height", EYE_RADIUS * 2)
                })

                const leftEye = getLeftEye()
                leftEye.addEventListener("mousedown", onClickLeftEye);
                setEyeTransform(leftEye, leftEyePos, eyeScale)

                const rightEye = getRightEye()
                rightEye.addEventListener("mousedown", onClickRightEye);
                setEyeTransform(rightEye, rightEyePos, eyeScale)

                planNextPupilMove()
            }

            function getLeftEye() {
                return document.getElementById("left-eye");
            }

            function getRightEye() {
                return document.getElementById("right-eye");
            }

            function getEye(which) {
                switch (which) {
                    case "left":    return getLeftEye();
                    case "right":   return getLeftEye();
                }

                return null;
            }

            function setEyeTransform(eye, position, scale) {
                const [ox, oy] = eyeOffset;
                eye.setAttribute("style", `transform: translate(${position[0] + eyeOffset[0]}px, ${position[1] + eyeOffset[1]}px) scale(${scale})`)
            }

            function updateEyeOffset(offset) {
                eyeOffset = offset;
                setEyeTransform(getLeftEye(), leftEyePos, eyeScale);
                setEyeTransform(getRightEye(), rightEyePos, eyeScale);
            }

// #region Vector ***************************************************************************************

            function vectorLength(vector) {
                const [x, y] = vector;
                return Math.sqrt(x * x + y * y);
            }

            /// vector is [number, number]
            function vectorNormalize(vector) {
                const [x, y] = vector;
                const length = vectorLength(vector);

                return [x / length, y / length];
            }

            function vectorScale(vector, amount) {
                const [x, y] = vector;
                return [x * amount, y * amount];
            }

            function vectorAdd(a, b) {
                const [ax, ay] = a;
                const [bx, by] = b;

                return [ax + bx, ay + by];
            }

            function currentTime() {
                return performance.now();
            } 

// #endregion

// #region Dragging eyes ***************************************************************************************

            function onClickLeftEye(e) {
                startEyeDrag(e.currentTarget, "left")                
            }

            function onClickRightEye(e) {
                startEyeDrag(e.currentTarget, "right")                
            }

            function startEyeDrag(eye, which) {
                const onMove = (me) => onDragEye(me, eye, which)
                window.addEventListener("mousemove", onMove)
                window.addEventListener("mouseup", () => window.removeEventListener("mousemove", onMove))
            }

            function onDragEye(me, eye, which) {
                const position = which === "left" ? leftEyePos : rightEyePos

                position[0] += me.movementX;
                position[1] += me.movementY;
                setEyeTransform(eye, position, eyeScale)

                if (which === "left") {
                    localStorage.setItem("leftX", position[0])
                    localStorage.setItem("leftY", position[1])
                } else {
                    localStorage.setItem("rightX", position[0])
                    localStorage.setItem("rightY", position[1])
                }
            }
// #endregion

// #region Adjust scale ***************************************************************************************
            
            function setScale(value) {
                eyeScale = value
                setEyeTransform(getLeftEye(), leftEyePos, eyeScale)
                setEyeTransform(getRightEye(), rightEyePos, eyeScale)

                localStorage.setItem("scale", eyeScale)
            }

            function scaleUp() {
                setScale(eyeScale + 0.05)
            }

            function scaleDown() {
                setScale(eyeScale - 0.05)
            }

// #endregion

// #region Pupil ******************************************************************************************
            function planNextPupilMove() {
                const next = 500 + Math.random() * 2000;

                const theta = Math.random() * Math.PI * 2;
                const distance = Math.random() * (EYE_RADIUS - PUPIL_RADIUS + 20);

                const x = Math.cos(theta);
                const y = Math.sin(theta) / 2;

                actionMovePupil(next, [x * distance, y * distance], () => planNextPupilMove())
            }

            function actionMovePupil(nextTime, target, onDone) {
                let lastActionTime = currentTime();
                let isDone = false;

                const pupilCoords = { x: pupilPosition[0], y: pupilPosition[1] }
                const pupilTween = new Tween(pupilCoords, false)
                    .to({x: target[0], y: target[1]}, 1000)
                    .easing(Easing.Quadratic.InOut)
                    .delay(nextTime)
                    .onUpdate(() => {
                        positionPupils([pupilCoords.x, pupilCoords.y])
                    })
                    .onComplete(() => {
                        isDone = true
                        offsetTween.stop()
                        onDone()
                    })
                    .start()

                const offsetCoords = { x: eyeOffset[0], y: eyeOffset[1] }
                const offsetTween = new Tween(offsetCoords, false)
                    .to({x: target[0] / 2, y: target[1] / 4}, 1500)
                    .easing(Easing.Quadratic.InOut)
                    .delay(nextTime)
                    .onUpdate(() => {
                        updateEyeOffset([offsetCoords.x, offsetCoords.y])
                    })
                    .start()

                function actionTick() {
                    if (isDone) {
                        return;
                    }
                    
                    pupilTween.update();
                    offsetTween.update();
                    setTimeout(actionTick, TICK_RATE);
                }

                setTimeout(actionTick, TICK_RATE);
            }

            function positionPupils([x, y]) {
                pupilPosition = [x, y];

                const pupils = document.querySelectorAll(".pupil");
                pupils.forEach(p => {
                    p.setAttribute("cx", x)
                    p.setAttribute("cy", y)
                })
            }
// #endregion

            initialize();
        </script>
    </head>
    <body>
        <svg viewBox="0 0 1920 1080">
            <g
                id="left-eye"
                class="eyebox"
                style="transform: translate(360px, 300px);"
            >
                <ellipse 
                    cx="0"
                    cy="0"
                    rx="240"
                    ry="320"
                    class="eye"
                />

                <ellipse 
                    id="left-pupil"
                    cx="0"
                    cy="0"
                    rx="120"
                    ry="160"
                    class="pupil"
                />
            </g>

            <g
                id="right-eye"
                class="eyebox"
                style="transform: translate(1500px, 300px);"
            >
                <ellipse 
                    cx="0"
                    cy="0"
                    rx="240"
                    ry="320"
                    class="eye"
                />

                <ellipse 
                    id="left-pupil"
                    cx="0"
                    cy="0"
                    rx="120"
                    ry="160"
                    class="pupil"
                />
            </g>

            <circle
                class="tickup"
                cx="900"
                cy="100"
                r="30"
                onclick="scaleUp()"
            />

            <circle
                class="tickdown"
                cx="1020"
                cy="100"
                r="30"
                onclick="scaleDown()"
            />
        </svg>
    </body>
</html>
